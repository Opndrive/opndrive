version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      root-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 10

  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    groups:
      frontend-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    open-pull-requests-limit: 10

  - package-ecosystem: 'npm'
    directory: '/s3-api'
    schedule:
      interval: 'weekly'
    groups:
      s3-api-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node version is NOT pinned here - every job reads .nvmrc via
  # setup-node's node-version-file, so contributors' local `nvm use` and CI
  # can never drift apart.
  PNPM_VERSION: '10.7.0'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      s3api: ${{ steps.filter.outputs.s3api }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            s3api:
              - 's3-api/**'
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.mjs'
              - 'prettier.config.js'
              - '.prettierignore'
              - '.nvmrc'
              - '.github/workflows/ci.yml'

  quality:
    name: Lint & format
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.s3api == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm exec prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml,css,scss,html,mjs,cjs}"

      # Deliberately no --max-warnings=0 here: the repo currently carries 98
      # pre-existing react-hooks/exhaustive-deps and ratcheted rules-of-hooks
      # warnings (see eslint.config.mjs) that are tracked separately, not
      # newly introduced. Zero-warning enforcement on touched files is done
      # by lint-staged in the pre-commit hook; this gate only fails on errors.
      - name: Lint
        run: pnpm exec eslint frontend/ s3-api/

  frontend:
    name: Frontend (typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.s3api == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**/*.ts', 'frontend/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_ENABLE_BLOG: 'false'

  s3-api:
    name: s3-api (typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.s3api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s3-api
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Runs the full suite AND enforces the coverage thresholds in
      # vitest.config.ts (95/90/95/95), so this single step both catches
      # regressions and fails the build if covered behaviour is removed.
      # No AWS credentials are needed: the suite mocks the SDK, and the
      # credential-gated integration tests in src/tests/ skip themselves.
      - name: Test & coverage gate
        run: pnpm test:coverage

      # Puts the gate's numbers on the run summary page instead of leaving them
      # buried in the job log. Runs even when the gate fails, which is exactly
      # when you want to see which metric dropped and by how much.
      - name: Publish coverage summary
        if: always()
        run: node ../.github/scripts/coverage-summary.mjs

      - name: Build
        run: pnpm build

  # Required-status-check target. Individual jobs are skipped by path
  # filtering, and GitHub treats "skipped" as never-satisfied for branch
  # protection, so branch protection must require this job, not the others.
  ci-ok:
    name: CI OK
    needs: [quality, frontend, s3-api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          for result in "${{ needs.quality.result }}" "${{ needs.frontend.result }}" "${{ needs.s3-api.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not succeed (result: $result)"
              exit 1
            fi
          done
          echo "All required jobs passed or were correctly skipped."
